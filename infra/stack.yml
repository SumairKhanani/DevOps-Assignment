AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD demo - S3 artifact bucket, EC2 web server, and GitHub OIDC deploy role.

Parameters:
  GitHubRepo:
    Type: String
    Description: owner/repo allowed to assume the deploy role (e.g. octocat/cicd-pipeline-demo)
  GitHubSubjectPrefix:
    Type: String
    Default: ''
    Description: >-
      Immutable OIDC subject prefix if the repo uses one, e.g. repo:owner@123/repo@456
      (see: gh api repos/OWNER/REPO/actions/oidc/customization/sub)
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if token.actions.githubusercontent.com already exists in this account
  InstanceType:
    Type: String
    Default: t3.micro
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  NodeVersion:
    Type: String
    Default: v22.21.1

Conditions:
  MakeOidc: !Equals [!Ref CreateOidcProvider, 'true']
  HasSubjectPrefix: !Not [!Equals [!Ref GitHubSubjectPrefix, '']]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-builds
            Status: Enabled
            Prefix: releases/
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }

  # ---------- EC2 web server ----------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP only - management is via SSM, no SSH
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-artifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ArtifactBucket.Arn}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      MetadataOptions: { HttpTokens: required }
      Tags:
        - { Key: Name, Value: cicd-demo-web }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y unzip
          curl -fsSL https://nodejs.org/dist/${NodeVersion}/node-${NodeVersion}-linux-x64.tar.xz | tar -xJ -C /opt
          ln -sfn /opt/node-${NodeVersion}-linux-x64/bin/node /usr/local/bin/node
          useradd --system --no-create-home --shell /sbin/nologin app || true
          mkdir -p /opt/app/releases
          cat > /etc/systemd/system/app.service <<'UNIT'
          [Unit]
          Description=CI/CD demo app
          After=network-online.target
          [Service]
          User=app
          WorkingDirectory=/opt/app/current
          Environment=NODE_ENV=production PORT=80
          ExecStart=/usr/local/bin/node src/server.js
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable app

  # ---------- GitHub Actions OIDC (no long-lived AWS keys in GitHub) ----------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubRepo}:environment:production'
                  - !If [HasSubjectPrefix, !Sub '${GitHubSubjectPrefix}:ref:refs/heads/main', !Ref AWS::NoValue]
                  - !If [HasSubjectPrefix, !Sub '${GitHubSubjectPrefix}:environment:production', !Ref AWS::NoValue]
      Policies:
        - PolicyName: ci-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${WebServer}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  InstanceId:
    Value: !Ref WebServer
  AppUrl:
    Value: !Sub 'http://${WebServer.PublicDnsName}'
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
